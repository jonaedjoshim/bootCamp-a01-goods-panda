<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods Panda | Ecommerce Landing Page</title>

    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header class="navbar-container">
        <nav class="navbar-content">
            <img src="assets/logo.png" alt="Goods Panda Logo" class="logo">
            <img src="assets/menu-bar.png" alt="Menu Icon" class="hamburger">
        </nav>
        <section class="hero-section">
            <div class="hero-content">
                <h1>Mi LED TV 4A PRO 32</h1>
                <p class="inter">Experience the ultimate cinematic view at home with the Mi LED TV 4A Pro.
                    High-definition display and smart connectivity bring your favorite shows to life with stunning
                    clarity and rich detail.</p>
                <h2 class="price">$1289</h2>
                <button class="buy-now-btn">BUY NOW</button>
            </div>
            <div class="hero-image">
                <img src="assets/hero-tv.png" alt="Mi LED TV 4A PRO 32">
            </div>
        </section>
    </header>
    <main>
        <section class="categories-section">
            <h2 class="section-title">Categories</h2>
            <div class="category-grid">
                <div class="cat-card watch-grad">
                    <h3>Watch</h3>
                    <img src="assets/category-watch.png" alt="Watch">
                </div>
                <div class="cat-card bag-grad">
                    <h3>Bag</h3>
                    <img src="assets/category-bag.png" alt="Bag">
                </div>
                <div class="cat-card shoes-grad">
                    <h3>Shoes</h3>
                    <img src="assets/category-shoe.png" alt="Shoes">
                </div>
            </div>
        </section>
    </main>

</body>

</html>
